<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Interview Question</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 450px;
            padding: 15px;
            font-size: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            margin-right: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .check-btn {
            background: #2563eb;
            color: white;
        }

        .add-btn {
            background: #16a34a;
            color: white;
        }

        .clear-btn {
            background: #666;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        #status {
            margin-top: 25px;
        }

        .preview {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }

        .preview h2 {
            margin-top: 0;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option {
            padding: 10px;
            margin: 8px 0;
            background: #f1f5f9;
            border-radius: 6px;
        }

        .correct {
            border-left: 5px solid #16a34a;
            background: #dcfce7;
        }

        .details {
            margin-top: 20px;
            line-height: 1.7;
        }

        .details strong {
            color: #333;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 6px;
            line-height: 1.6;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <h1>Add Interview Question</h1>

    <div class="subtitle">
        Paste your complete question below. The page will automatically parse it.
    </div>

    <textarea
        id="questionInput"
        placeholder="Paste your complete question here...

Example:

Question: What is a Snowflake Stream?

Options:
1. A virtual warehouse
2. A database object that captures data change information
3. A file format
4. A table

Answer:
2. A database object that captures data change information

Dataset:
No dataset required

Expected Output:
The stream captures information about changed rows.

Level:
Medium

Topic:
Snowflake

Explanation:
A Snowflake Stream records change data capture information..."
    ></textarea>

    <br>

    <div class="token-section">
    <label for="githubToken">
        GitHub Token
    </label>

    <input
        type="password"
        id="githubToken"
        placeholder="Paste your GitHub token here"
        autocomplete="off"
    />

    <small>
        Your token is used only in this browser session and is not saved to GitHub.
    </small>
</div>
    
    <button class="check-btn" onclick="checkAndAdd()">
        Check & Preview
    </button>

    <button class="clear-btn" onclick="clearForm()">
        Clear
    </button>

    <div id="status"></div>

    <div id="previewContainer" class="hidden">

        <div class="preview">

            <h2>Question Preview</h2>

            <div id="previewQuestion" class="question"></div>

            <div id="previewOptions"></div>

            <div class="details">

                <div>
                    <strong>Answer:</strong>
                    <span id="previewAnswer"></span>
                </div>

                <div>
                    <strong>Level:</strong>
                    <span id="previewLevel"></span>
                </div>

                <div>
                    <strong>Topic:</strong>
                    <span id="previewTopic"></span>
                </div>

                <div>
                    <strong>Dataset:</strong>
                    <span id="previewDataset"></span>
                </div>

                <div>
                    <strong>Expected Output:</strong>
                    <span id="previewExpectedOutput"></span>
                </div>

                <div class="explanation">
                    <strong>Explanation:</strong>
                    <div id="previewExplanation"></div>
                </div>

            </div>

            <button
                id="addQuestionButton"
                class="add-btn"
                onclick="addQuestion()">
                Add Question
            </button>

        </div>

    </div>

    <script src="./add-question.js"></script>

</body>
</html>
