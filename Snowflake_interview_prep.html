answer:`
Hi, I'm Sai. I have around eight years of experience, with strong experience in SQL Server and Snowflake.

Currently, I'm working on a banking project where Basel-related data is one of the major source inputs.

The source data initially comes in the form of files and is processed through the mainframe environment, where it is loaded into staging tables.

From the staging layer, the data is organized into fact and dimension structures.

The data is then made available to our Snowflake environment, particularly the GCPTSL layer. In our architecture, the staging data is exposed to the GCPTSL layer through views where applicable, rather than unnecessarily duplicating the data.

My primary responsibility is in the GCPTSL layer, where we apply business rules and transformation logic. We create and maintain business views and SQL logic based on the reporting requirements.

The resulting Snowflake objects are then consumed by our SSAS Tabular layer. SSAS acts as a semantic layer between Snowflake and Power BI, where we also implement modeling and performance optimizations.

Power BI reports consume the SSAS model for reporting and analysis.

So, at a high level, the flow is:

Source files → Mainframe processing → Staging → Snowflake/GCPTSL → Business logic and views → SSAS → Power BI.

My major area of responsibility is the Snowflake GCPTSL layer, particularly business logic, SQL development, data validation, reconciliation, and performance-related improvements.
`
},

    {
title: "Snowflake View Performance - Multiple Joins",

question: `
What happens to performance if the view contains five joins?
`,

dataset:[
{
VIEW:"GCPTSL business view",
JOINS:5,
TABLES:"Multiple staging/core fact and dimension tables",
CONSUMER:"SSAS"
}
],

output:[
{
IMPACT:"The query can become more expensive because Snowflake has to process the joins when the view is queried.",
KEY_POINT:"A standard view does not store the query result physically. The underlying query is executed when the view is queried.",
}
],

answer:`
If a view contains five joins, performance depends mainly on the size of the underlying tables, join conditions, filters, and how much data needs to be processed.

A standard Snowflake view does not physically store the result. When the view is queried, Snowflake expands the view definition and executes the underlying query.

With five joins, Snowflake may need to scan and join large amounts of data. This can increase execution time, bytes scanned, memory usage, and potentially warehouse consumption.

However, having five joins does not automatically mean that the query will be slow. Snowflake's optimizer can optimize the execution plan.

I would therefore check the actual query profile and identify where the expensive scans, joins, or data movement are occurring.
`
},

    {
title: "Snowflake View Performance - Optimization",

question: `
A business view contains multiple joins and is running slowly. How would you optimize it?
`,

dataset:[
{
PROBLEM:"Slow GCPTSL business view",
POSSIBLE_CAUSES:"Large scans, inefficient joins, poor filtering, unnecessary columns, data volume"
}
],

output:[
{
APPROACH:"Analyze Query Profile → reduce unnecessary data → improve filtering → review joins → optimize underlying tables → consider precomputation where appropriate"
}
],

answer:`
First, I would not immediately increase the warehouse size. I would first identify the actual bottleneck using the Query Profile.

I would check whether the query is scanning large amounts of data and whether any particular join is expensive.

Then I would:

1. Select only the required columns instead of using SELECT *.

2. Apply appropriate filters as early as possible so that less data needs to be processed.

3. Review the join conditions and make sure the joins are using the correct keys and are not unintentionally multiplying rows.

4. Check whether unnecessary joins can be removed.

5. Check whether the underlying tables are suitable for pruning and whether clustering would help for frequently filtered large tables.

6. Check whether the same expensive transformation is repeatedly being calculated.

7. If the business requirement justifies it, consider precomputed approaches such as a materialized view or a physically maintained table instead of recalculating an expensive transformation every time.

8. Finally, if the query is still legitimately compute-intensive, I would evaluate whether the warehouse size is appropriate.

The important point is that I would first identify the bottleneck rather than simply scaling up the warehouse.
`
},

    {
title: "Snowflake Query Analysis - Detecting Large Scans",

question: `
How do you know whether a view is scanning a large amount of data?
`,

dataset:[
{
TOOL:"Snowflake Query Profile",
METRICS:"Bytes scanned, partitions scanned, partitions total, execution time"
}
],

output:[
{
CHECK:"Query Profile and Query History",
INDICATORS:"Large bytes scanned, high partitions scanned, poor partition pruning, expensive table scans"
}
],

answer:`
I would execute the query against the view and open the Query Profile in Snowsight.

In the Query Profile, I would look at the table scan operations and check metrics such as the amount of data scanned and the number of partitions scanned compared with the total number of partitions.

For example, if a table has a large number of micro-partitions and the query scans most of them, that indicates that partition pruning may not be effective.

I would also look at the bytes scanned and identify which table scan or operation is contributing most of the work.

I would then investigate whether better filtering, query predicates, data organization, or clustering could improve pruning.

I would not judge performance only from the total query duration. I would use the Query Profile to identify where the data is actually being processed.
`
},

    {
title: "Snowflake Query Performance - Monitoring",

question: `
How do you check query performance in Snowflake?
`,

dataset:[
{
TOOLS:"Snowsight Query History and Query Profile",
ADDITIONAL:"ACCOUNT_USAGE / INFORMATION_SCHEMA query history"
}
],

output:[
{
CHECK:"Execution time, bytes scanned, partitions scanned, warehouse, compilation time, query profile, spill and expensive operators"
}
],

answer:`
I normally start with Query History in Snowsight.

I check:

1. Total execution time.
2. Bytes scanned.
3. Warehouse used.
4. Query start and end time.
5. Compilation time where relevant.
6. Whether the query is using cache.
7. Query Profile for detailed execution information.

In the Query Profile, I look for expensive table scans, joins, aggregations, data movement, and possible spilling.

For large queries, I also check partition pruning by comparing partitions scanned with partitions available.

For historical analysis or programmatic monitoring, Snowflake also provides query history information through the appropriate account usage or information schema views/functions.

After identifying the bottleneck, I decide whether the solution should be query optimization, better pruning/data organization, a different physical design, precomputation, or warehouse sizing.
`
},
    {
title: "Infosys L2 - Recent Snowflake Development in GCPTSL",
question: `
What is the recent development you have done in the Snowflake GCPTSL layer?
Can you explain one recent development you made in a dimension, view, or any other Snowflake object?
`,
dataset:[
{LAYER:"GCPTSL", DEVELOPMENT:"Modification of an existing business view", AREA:"Business rule and dimension-related logic", VALIDATION:"Data validation and reconciliation", PERFORMANCE:"Snowflake query performance check", DOWNSTREAM:"SSAS and Power BI"}
],
output:[
{REQUIREMENT:"Business requirement identified", ANALYSIS:"Existing view, source tables, joins and business logic analyzed", IMPLEMENTATION:"Required dimension/business rule logic added", VALIDATION:"Output compared with expected business results and upstream data", PERFORMANCE:"Query execution and impact of additional joins checked", DEPLOYMENT:"Changes moved through the deployment process", DOWNSTREAM_IMPACT:"Updated view consumed by SSAS and Power BI"}
],
answer:`
One of my recent developments in the GCPTSL layer was related to a business requirement where we had to modify an existing business view to incorporate an additional business rule and dimension-related logic.

I first analyzed the existing view and traced the underlying source tables and joins to understand how the current data was being derived.

Based on the requirement, I identified the relevant dimension and added the required logic to the view while making sure that the existing business rules and output were not impacted.

After implementing the change, I performed data validation by comparing the new output with the expected business results and also performed reconciliation with the upstream data.

I also checked the impact of the additional join and logic on query performance using Snowflake's query execution details.

Once the validation was completed, the changes were moved through the development and deployment process, and the updated view was consumed by the downstream SSAS model and Power BI reports.

So, my recent work was not just creating or modifying a view. It involved understanding the business requirement, analyzing the existing Snowflake logic, implementing the change, validating the data, checking performance, and ensuring that the downstream reporting was not impacted.
`
},

    {
title: "Infosys L2 - End-to-End Testing After Snowflake Object Development",
question: `
Once you develop a Snowflake object such as a view, how is testing performed?
Can you explain the complete end-to-end testing process from development to production?
`,
dataset:[
{STEP:1, ACTIVITY:"Requirement Analysis", DETAILS:"Understand the business requirement, source tables, target output, business rules and expected results"},
{STEP:2, ACTIVITY:"Development", DETAILS:"Develop or modify the Snowflake view, SQL logic, joins, filters and business rules in the development environment"},
{STEP:3, ACTIVITY:"Unit Testing", DETAILS:"Validate the object using sample and business scenarios and check the SQL output"},
{STEP:4, ACTIVITY:"Data Validation", DETAILS:"Compare source and target data, record counts, key values, NULLs, duplicates and business calculations"},
{STEP:5, ACTIVITY:"Reconciliation", DETAILS:"Reconcile important measures and records with upstream data and expected business results"},
{STEP:6, ACTIVITY:"Regression Testing", DETAILS:"Make sure the existing functionality and existing reports are not impacted"},
{STEP:7, ACTIVITY:"Performance Testing", DETAILS:"Check query execution details, data scanned, joins, partition pruning and execution time"},
{STEP:8, ACTIVITY:"Downstream Validation", DETAILS:"Validate that SSAS and Power BI consume the expected data and that reports are not impacted"},
{STEP:9, ACTIVITY:"Code Review", DETAILS:"SQL code and changes are reviewed according to the project process"},
{STEP:10, ACTIVITY:"Deployment", DETAILS:"Move the tested changes through the required environments using the project deployment process"},
{STEP:11, ACTIVITY:"Post-Deployment Validation", DETAILS:"Validate the object and important data in the target environment after deployment"}
],
output:[
{FLOW:"Requirement → Development → Unit Testing → Data Validation → Reconciliation → Regression Testing → Performance Testing → Downstream Validation → Code Review → Deployment → Post-Deployment Validation"},
{VALIDATION_EXAMPLES:"Row counts, key-level comparison, NULL checks, duplicate checks, business-rule validation, aggregate reconciliation and downstream report validation"}
],
answer:`
Once I develop or modify a Snowflake object, such as a business view in the GCPTSL layer, I follow an end-to-end testing and validation process.

First, I understand the requirement clearly. I identify the source tables, relevant dimensions or facts, business rules, expected output and any downstream objects that may be impacted.

Then I develop or modify the object in the development environment. For example, if I am modifying a view, I validate the joins, filters, calculated columns and business logic.

After development, I perform unit testing. I execute the view with different scenarios and verify whether the output is logically correct.

Then I perform data validation. I compare the output with the upstream data and expected business results. Depending on the requirement, I check record counts, key-level data, NULL values, duplicate records and important business columns or measures.

I also perform reconciliation. For example, if the view contains an important measure, I compare the aggregated value between the source and target or compare it with the existing validated data to make sure there is no unexpected difference.

After that, I perform regression testing. Since I may be modifying an existing view, I make sure that the existing functionality has not been impacted and that existing downstream objects or reports continue to return the expected results.

I also check performance. In Snowflake, I can look at the query execution details and Query Profile to understand whether the change introduced an expensive join, large scan, poor pruning or other performance issues.

Since our Snowflake objects are consumed by the downstream SSAS layer and Power BI reports, I also validate the downstream impact. I make sure the expected data is available to SSAS and that the relevant reports are showing the expected results.

Once the development and testing are completed, the code goes through the required code review and deployment process. After deployment to the higher environment, I perform post-deployment validation to confirm that the object was deployed correctly and the expected data is available.

So, my overall testing flow is:

Requirement analysis → Development → Unit testing → Data validation → Reconciliation → Regression testing → Performance testing → Downstream validation → Code review → Deployment → Post-deployment validation.

The important point is that I don't consider testing as only checking whether the SQL query runs successfully. I validate both the technical correctness and the business correctness of the data, and I also check the impact on downstream reporting.
`
},

    function createJumpButtons() {

    const container = document.getElementById('jumpButtons');

    container.innerHTML = '';

    questions.forEach((q, idx) => {

        const btn = document.createElement('button');

        btn.textContent = q.title;

        btn.title = q.title;

        btn.onclick = () => {

            currentQuestion = idx;

            renderQuestion(idx);

        };

        container.appendChild(btn);

    });

}

function renderTableFromObjects(list) {
    if (!list || list.length === 0) return '';
    const cols = Object.keys(list[0]);
    let html = '<table><thead><tr>';
    cols.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    list.forEach(r => {
        html += '<tr>';
        cols.forEach(c => html += `<td>${r[c]}</td>`);
        html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

function renderQuestion(index) {
    const q = questions[index];
    // Question text
    document.getElementById('questionBox').innerHTML = `<h3>Question ${index + 1}</h3><p>${q.question.replace(/\n\s+/g,'\n')}</p>`;

    // Dataset
    const datasetHtml = q.dataset && q.dataset.length ? renderTableFromObjects(q.dataset) : '<p>No dataset for this question.</p>';
    document.getElementById('datasetBox').innerHTML = datasetHtml;

    // Dataset2
    const datasetHtml2 = q.dataset2 && q.dataset2.length ? renderTableFromObjects(q.dataset2) : '<p>No dataset for this question.</p>';
    document.getElementById('datasetBox2').innerHTML = datasetHtml2;

    // Dataset3
    const datasetHtml3 = q.dataset3 && q.dataset3.length ? renderTableFromObjects(q.dataset3) : '<p>No dataset for this question.</p>';
    document.getElementById('datasetBox3').innerHTML = datasetHtml3;

    
    // Output
    const outputHtml = q.output && q.output.length ? renderTableFromObjects(q.output) : '<p>No output for this question.</p>';
    document.getElementById('outputBox').innerHTML = outputHtml;

    // Answers: combine answer, answer_1, answer_2, explanation
    let answerText = '';
    if (q.answer) answerText += q.answer.trim() + '\n\n';
    if (q.answer_1) answerText += '-- Solution 1:\n' + q.answer_1.trim() + '\n\n';
    if (q.answer_2) answerText += '-- Solution 2:\n' + q.answer_2.trim() + '\n\n';
    if (q.explanation) answerText += '-- Explanation:\n' + q.explanation.trim();

    document.getElementById('answerBox').textContent = answerText || '-- No answer provided --';

    // update counter
    document.getElementById('questionCounter').textContent = `Question ${index+1} of ${questions.length}`;
}

/* Navigation buttons */
document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion(currentQuestion);
    }
});
document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion(currentQuestion);
    }
});

/* Initialize UI */
createJumpButtons();
renderQuestion(0);
