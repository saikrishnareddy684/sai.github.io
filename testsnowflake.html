    IF (EXISTS (
        SELECT 1

        WHERE id = :pid
    )) THEN

        SET salary = COALESCE(salary,10) * 1.10
        WHERE id = :pid;

    END IF;

    answer: `
CREATE OR REPLACE PROCEDURE LOAD_SCD2()
RETURNS STRING
LANGUAGE SQL
AS
$$
DECLARE
    V_UPDATED NUMBER;
    V_INSERTED NUMBER;
BEGIN

    CREATE OR REPLACE TEMP TABLE TMP_CHANGES AS
    SELECT CUSTOMER_ID, CUSTOMER_NAME, SALARY
    FROM STG_CUSTOMER_STREAM
    WHERE METADATA$ACTION='INSERT';

    -- Step 1: Expire old active records
    MERGE INTO DIM_CUSTOMER T
    USING TMP_CHANGES S
    ON T.CUSTOMER_ID=S.CUSTOMER_ID AND T.CURRENT_FLAG='Y'
    WHEN MATCHED AND (T.CUSTOMER_NAME<>S.CUSTOMER_NAME OR T.SALARY<>S.SALARY)
    THEN UPDATE SET CURRENT_FLAG='N', END_DATE=CURRENT_DATE();

    V_UPDATED := SQLROWCOUNT;

    -- Step 2: Insert new current records
    INSERT INTO DIM_CUSTOMER (CUSTOMER_ID, CUSTOMER_NAME, SALARY, START_DATE, END_DATE, CURRENT_FLAG)
    SELECT S.CUSTOMER_ID, S.CUSTOMER_NAME, S.SALARY, CURRENT_DATE(), NULL, 'Y'
    FROM TMP_CHANGES S
    LEFT JOIN DIM_CUSTOMER D ON S.CUSTOMER_ID=D.CUSTOMER_ID AND D.CURRENT_FLAG='Y'
    WHERE D.CUSTOMER_ID IS NULL;

    V_INSERTED := SQLROWCOUNT;

    RETURN 'Updated = ' || V_UPDATED || ', Inserted = ' || V_INSERTED;

END;
$$;

CALL LOAD_SCD2();
`

CREATE PIPE EMPLOYEE_PIPE AS

-- Step 2: Stream on Raw Table
CREATE STREAM EMPLOYEE_STREAM ON TABLE EMPLOYEE_RAW;

-- Step 3: Target Table & Automated Task
CREATE TABLE EMPLOYEE_DIM (EMP_ID NUMBER, EMP_NAME STRING);

CREATE TASK EMPLOYEE_TASK
  WAREHOUSE = COMPUTE_WH
  SCHEDULE = '1 MINUTE'
  WHEN SYSTEM$STREAM_HAS_DATA('EMPLOYEE_STREAM')

  MERGE INTO EMPLOYEE_DIM T
  USING EMPLOYEE_STREAM S ON T.EMP_ID = S.EMP_ID
  WHEN MATCHED THEN UPDATE SET T.EMP_NAME = S.EMP_NAME
  WHEN NOT MATCHED THEN INSERT (EMP_ID, EMP_NAME) VALUES (S.EMP_ID, S.EMP_NAME);

ALTER TASK EMPLOYEE_TASK RESUME;

WITH SALES AS (
    SELECT CUSTOMER_SK, SUM(SALES_AMOUNT) AS TOTAL_SALES
    FROM FACT_SALES GROUP BY CUSTOMER_SK
),
RETURNS AS (
    SELECT CUSTOMER_SK, SUM(REFUND_AMOUNT) AS TOTAL_REFUNDS
    FROM FACT_RETURNS GROUP BY CUSTOMER_SK
)
SELECT
    C.CUSTOMER_NAME,
    COALESCE(S.TOTAL_SALES, 0) AS TOTAL_SALES,
    COALESCE(R.TOTAL_REFUNDS, 0) AS TOTAL_REFUNDS
FROM DIM_CUSTOMER C
LEFT JOIN SALES S ON C.CUSTOMER_SK = S.CUSTOMER_SK
LEFT JOIN RETURNS R ON C.CUSTOMER_SK = R.CUSTOMER_SK;
`
  },
  {
    topic: "Data Warehousing",
    title: "Degenerate Dimension - Transaction ID in Fact Table",
    question: `
Implement a Degenerate Dimension where ORDER_ID is stored directly in FACT_SALES without creating an explicit DIM_ORDER table.
`,
    dataset: [
      {ORDER_ID: 1001, CUSTOMER_SK: 1, PRODUCT_SK: 11, SALES_AMOUNT: 500}
    ],
    output: [
      {ORDER_ID: 1001, CUSTOMER_NAME: "Sai", PRODUCT_NAME: "Laptop", SALES_AMOUNT: 500}
    ],
    answer: `
-- Retrieve Sales Report with Degenerate Dimension ORDER_ID
SELECT
    F.ORDER_ID,
    C.CUSTOMER_NAME,
    P.PRODUCT_NAME,
    F.SALES_AMOUNT
FROM FACT_SALES F
JOIN DIM_CUSTOMER C ON F.CUSTOMER_SK = C.CUSTOMER_SK
JOIN DIM_PRODUCT P ON F.PRODUCT_SK = P.PRODUCT_SK;

-- Explanation: ORDER_ID is a degenerate dimension because it lives in the fact 
-- table without requiring a standalone dimension table.
`
  },
  {
    topic: "Data Warehousing",
    title: "Junk Dimension - Consolidating Low-Cardinality Flags",
    question: `
Create and load a Junk Dimension (DIM_JUNK) by extracting distinct combinations of low-cardinality flags (IS_PROMOTION, PAYMENT_MODE, etc.) from raw sales data.
`,
    dataset: [
      {SALES_ID: 1, IS_PROMOTION: "Y", PAYMENT_MODE: "Card", IS_ONLINE: "Y", IS_RETURNED: "N", SALES_AMOUNT: 1500}
    ],
    output: [
      {SALES_ID: 1, JUNK_KEY: 1, SALES_AMOUNT: 1500}
    ],
    answer: `
-- Step 1: Create Junk Dimension Table
CREATE OR REPLACE TABLE DIM_JUNK (
    JUNK_KEY INT IDENTITY(1,1),
    IS_PROMOTION STRING,
    PAYMENT_MODE STRING,
    IS_ONLINE STRING,
    IS_RETURNED STRING
);

INSERT INTO DIM_JUNK (IS_PROMOTION, PAYMENT_MODE, IS_ONLINE, IS_RETURNED)
SELECT DISTINCT IS_PROMOTION, PAYMENT_MODE, IS_ONLINE, IS_RETURNED
FROM SALES_RAW;

-- Step 2: Load Fact Table replacing flags with JUNK_KEY
CREATE OR REPLACE TABLE FACT_SALES (
    SALES_ID INT,
    PRODUCT_KEY INT,
    CUSTOMER_KEY INT,
    JUNK_KEY INT,
    SALES_AMOUNT NUMBER(10,2)
);

INSERT INTO FACT_SALES
SELECT
    S.SALES_ID,
    S.PRODUCT_KEY,
    S.CUSTOMER_KEY,
    J.JUNK_KEY,
    S.SALES_AMOUNT
FROM SALES_RAW S
JOIN DIM_JUNK J
  ON S.IS_PROMOTION = J.IS_PROMOTION
 AND S.PAYMENT_MODE = J.PAYMENT_MODE
 AND S.IS_ONLINE = J.IS_ONLINE
 AND S.IS_RETURNED = J.IS_RETURNED;
`
  }
];

/* ============================
   UI & Rendering Logic
   ============================ */

let currentQuestion = 0;

function createJumpButtons() {
    const container = document.getElementById('jumpButtons');
    container.innerHTML = '';

    questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.textContent = `[${q.topic}] ${q.title}`;
        btn.title = q.title;
        btn.onclick = () => {
            currentQuestion = idx;
            renderQuestion(idx);
        };
        container.appendChild(btn);
    });
}

function renderTableFromObjects(list) {
    if (!list || list.length === 0) return '<p>No data available.</p>';
    if (typeof list === 'object' && !Array.isArray(list)) {
        return `<pre>${JSON.stringify(list, null, 2)}</pre>`;
    }
    const cols = Object.keys(list[0]);
    let html = '<table><thead><tr>';
    cols.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    list.forEach(r => {
        html += '<tr>';
        cols.forEach(c => html += `<td>${r[c] !== null ? r[c] : 'NULL'}</td>`);
        html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

function renderQuestion(index) {
    const q = questions[index];
    
    // Header & Question
    document.getElementById('questionBox').innerHTML = `
        <span style="background:#008CBA; color:white; padding:3px 8px; border-radius:4px; font-size:12px;">${q.topic}</span>
        <h3>Question ${index + 1}: ${q.title}</h3>
        <p>${q.question.replace(/\n/g, '<br>')}</p>
    `;

    // Dataset 1
    document.getElementById('datasetBox').innerHTML = renderTableFromObjects(q.dataset);

    // Dataset 2
    document.getElementById('datasetBox2').innerHTML = renderTableFromObjects(q.dataset2);

    // Dataset 3
    document.getElementById('datasetBox3').innerHTML = renderTableFromObjects(q.dataset3);

    // Output
    document.getElementById('outputBox').innerHTML = renderTableFromObjects(q.output);

    // Answer & Explanation
    let answerText = '';
    if (q.answer) answerText += q.answer.trim() + '\n\n';
    if (q.explanation) answerText += '-- Explanation:\n' + q.explanation.trim();

    document.getElementById('answerBox').textContent = answerText || '-- No answer provided --';

    // Update Counter
    document.getElementById('questionCounter').textContent = `Question ${index + 1} of ${questions.length}`;
}

/* Navigation event listeners */
document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion(currentQuestion);
    }
});
document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion(currentQuestion);
    }
});

/* Initialize UI */
createJumpButtons();
renderQuestion(0);

</script>
